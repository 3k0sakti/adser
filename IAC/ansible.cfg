[defaults]
# Nonaktifkan pengecekan SSH host key (tidak relevan untuk Docker connection)
host_key_checking = False

# Auto-detect Python interpreter di managed node
interpreter_python = auto_silent

# Path collection
collections_path = ~/.ansible/collections

# Format output yang lebih informatif
stdout_callback = yaml

# Jumlah koneksi paralel (atur sesuai jumlah container)
forks = 5

[privilege_escalation]
# Di container Docker sebagai root, become tidak diperlukan
# Aktifkan jika target bukan root:
# become = true
# become_method = sudo
