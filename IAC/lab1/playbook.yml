---
# ══════════════════════════════════════════════════════════════
# LAB 1 — Ansible Playbook Pertama
# Matakuliah Advanced Services | Universitas Brawijaya
# ══════════════════════════════════════════════════════════════
#
# CARA MENJALANKAN:
#   1. Buat container target:
#      docker run -d --name web-target -p 8080:80 ubuntu:22.04 sleep infinity
#   2. Aktifkan venv: source ../.venv/bin/activate
#   3. Jalankan: ansible-playbook -i inventory.yml playbook.yml
#   4. Buka browser: http://localhost:8080
#   5. Jalankan ULANG untuk melihat idempoten (changed=0)
#
# ══════════════════════════════════════════════════════════════

- name: Setup Web Server di Container
  hosts: webservers
  gather_facts: yes

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Buat halaman HTML custom
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>IAC Hands-On Lab 1</title>
            <style>
              body { background: #0a0f1e; color: #4fc3f7; font-family: monospace; padding: 2rem; }
              .box { background: #1e2a3a; border-left: 4px solid #4fc3f7; padding: 1rem; border-radius: 0 8px 8px 0; }
            </style>
          </head>
          <body>
            <h1>🚀 Ansible berhasil mengkonfigurasi server ini!</h1>
            <div class="box">
              <p>🖥️ Container: {{ inventory_hostname }}</p>
              <p>🐧 OS: {{ ansible_distribution }} {{ ansible_distribution_version }}</p>
              <p>🌐 IP: {{ ansible_default_ipv4.address | default('N/A') }}</p>
              <p>⏰ Waktu konfigurasi: {{ ansible_date_time.iso8601 }}</p>
            </div>
            <p style="color:#9e9e9e; margin-top:2rem; font-size:.85rem;">
              Matakuliah Advanced Services — Universitas Brawijaya
            </p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Jalankan nginx (background)
      ansible.builtin.shell:
        cmd: nginx -g 'daemon off;' &
      args:
        executable: /bin/bash
      async: 10
      poll: 0
      changed_when: false

    - name: Tunggu nginx siap di port 80
      ansible.builtin.wait_for:
        host: localhost
        port: 80
        timeout: 15

    - name: Verifikasi HTTP response
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200
        timeout: 10
      register: http_check

    - name: Tampilkan hasil verifikasi
      ansible.builtin.debug:
        msg: "✅ HTTP {{ http_check.status }} — nginx berjalan di {{ inventory_hostname }}!"
